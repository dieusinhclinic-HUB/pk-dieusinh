<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PK Diệu Sinh — Đăng nhập</title>
<link rel="preconnect" href="https://bhixwqpyvspmtumbvbhc.supabase.co">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-api.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --brand:#0a5240; --brand2:#0f6e56; --brand3:#12836a;
    --brand-soft:#e3f2ed; --brand-bg:#f0f8f5;
    --ink:#20241f; --ink2:#5c635a; --ink3:#8a9187;
    --crit:#d03b3b;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--brand-bg);color:var(--ink);font-size:14px;}
  #loginView{display:grid;place-items:center;min-height:100vh;padding:20px;}
  .logincard{background:#fff;border-radius:20px;box-shadow:0 10px 36px rgba(10,82,64,.13);padding:38px 42px;width:min(420px,100%);text-align:center;}
  .logincard .logo{font-size:40px;}
  .logincard h1{font-size:20px;color:var(--brand);margin:10px 0 4px;}
  .logincard .sub{color:var(--ink2);font-size:13px;margin-bottom:22px;}
  #gbtn{display:flex;justify-content:center;margin-bottom:14px;}
  #loginMsg{font-size:12.5px;color:var(--ink3);min-height:18px;}
  #loginMsg.err{color:var(--crit);font-weight:600;}
  .spin{width:26px;height:26px;border:3px solid var(--brand-soft);border-top-color:var(--brand3);border-radius:50%;animation:sp 1s linear infinite;margin:14px auto 0;display:none;}
  #loginView.busy .spin{display:block;}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="loginView">
  <div class="logincard">
    <div class="logo">🌿</div>
    <h1>Phòng khám Diệu Sinh</h1>
    <div class="sub">Đăng nhập bằng tài khoản Google được cấp quyền.<br>Hệ thống sẽ tự mở màn hình làm việc của bạn.</div>
    <div id="gbtn"></div>
    <div id="loginMsg"></div>
    <div class="spin"></div>
  </div>
</div>

<script>
/* ================== CẤU HÌNH ================== */
const CLIENT_ID = '24934364100-lm5evib5edi07vcth61qnd56a9q72ee6.apps.googleusercontent.com';
const SESS_KEY  = 'pk_sess';           // dùng CHUNG với các màn hình → đăng nhập 1 lần

/* Màn hình theo VAI TRÒ — trang đầu tiên là trang mặc định của vai trò */
const ROLE_PAGES = {
  'Quản lý':  ['tong-quan.html','thu-ngan.html','ban-kham.html','ban-thu-ky.html','duoc-sy.html'],
  'Kế toán':  ['tong-quan.html'],
  'Thu ngân': ['thu-ngan.html'],
  'Lễ tân':   ['thu-ngan.html'],
  'Bác sĩ':   ['ban-kham.html'],
  'Thư ký':   ['ban-kham.html','ban-thu-ky.html'],
  'Dược sỹ':  ['duoc-sy.html']
};

let token = null;
const $ = id => document.getElementById(id);

function loadSess(){
  try{ const s = JSON.parse(localStorage.getItem(SESS_KEY)||'null');
    return (s && s.sess && s.exp > Date.now()+60000) ? s : null;
  }catch(e){ return null; }
}

/* ================== CHUYỂN VÀO MÀN HÌNH LÀM VIỆC ================== */
function enterApp(role){
  const pages = ROLE_PAGES[String(role||'').trim()] || [];
  if (!pages.length){
    $('loginMsg').className = 'err';
    $('loginMsg').textContent = 'Vai trò "'+role+'" chưa được gán màn hình — liên hệ quản trị.';
    try{ localStorage.removeItem(SESS_KEY); }catch(e){}
    document.getElementById('loginView').classList.remove('busy');
    token = null; return;
  }
  let target = pages[0];
  try{
    const last = localStorage.getItem('pk_last_page');
    if (last && pages.indexOf(last) !== -1) target = last;
  }catch(e){}
  location.replace(target);
}

/* ================== ĐĂNG NHẬP ================== */
function gisInit(){
  google.accounts.id.initialize({ client_id: CLIENT_ID, callback: onCredential });
  google.accounts.id.renderButton($('gbtn'), { theme:'filled_blue', size:'large', text:'signin_with', shape:'pill', width:280 });
}
async function onCredential(resp){
  token = resp.credential;
  $('loginView').classList.add('busy');
  $('loginMsg').className = ''; $('loginMsg').textContent = 'Đang kiểm tra quyền…';
  try{
    const w = await SB_API('login', {token});
    if (!w.ok){
      $('loginMsg').className = 'err';
      $('loginMsg').textContent = w.error==='NOT_AUTHORIZED' ? 'Email này chưa được cấp quyền (chưa có trong danh sách nhân sự).' : ('Lỗi: '+(w.error||''));
      $('loginView').classList.remove('busy');
      token = null; return;
    }
    if (w.sess){ try{ localStorage.setItem(SESS_KEY, JSON.stringify({sess:w.sess, email:w.email, role:w.role, ho_ten:w.ho_ten||'', exp:w.exp})); }catch(e){} }
    enterApp(w.role);
  }catch(e){
    $('loginMsg').className = 'err';
    $('loginMsg').textContent = 'Không gọi được máy chủ — kiểm tra mạng.';
    $('loginView').classList.remove('busy');
  }
}
window.addEventListener('load', () => {
  /* đã có phiên hợp lệ → vào thẳng màn hình làm việc */
  const s = loadSess();
  if (s){
    $('loginView').classList.add('busy');
    $('loginMsg').textContent = 'Đang mở màn hình làm việc…';
    enterApp(s.role);
    return;
  }
  const t = setInterval(()=>{ if (window.google && google.accounts){ clearInterval(t); gisInit(); } }, 200);
  setTimeout(()=>clearInterval(t), 10000);
});
</script>
</body>
</html>
